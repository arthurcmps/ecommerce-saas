<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerir Produtos - Lojista</title>
    <link rel="stylesheet" href="public/css/style.css">
    <link rel="stylesheet" href="public/css/dashboard.css">
    <link rel="stylesheet" href="public/css/produtos.css">
</head>
<body>
    <div id="dashboard-content" class="dashboard-container" style="display: none;">
        
        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="top-header">
                <h1>Os Meus Produtos</h1>
                <button id="btn-open-modal" class="primary-btn">+ Novo Produto</button>
            </header>

            <section class="products-container">
                <div id="products-list" class="products-grid">
                    <p style="color: #a0aec0; grid-column: 1 / -1; text-align: center;">A carregar o inventário...</p>
                </div>
            </section>
        </main>
    </div>

    <div id="product-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
            <div class="modal-header">
                <h2 id="modal-title">Adicionar Novo Produto</h2>
                <button id="btn-close-modal" class="close-btn">&times;</button>
            </div>
            <form id="add-product-form">
                <div class="input-group">
                    <label for="prod-name">Nome do Produto</label>
                    <input type="text" id="prod-name" placeholder="Ex: T-shirt Oversized" required>
                </div>
                
                <!-- NOVO: Seletor de Categoria e Atributos Dinâmicos -->
                <div class="input-group" style="margin-top: 0.5rem;">
                    <label for="product-category">Categoria do Produto</label>
                    <select id="product-category" required style="width: 100%; padding: 1rem; border-radius: 8px; border: 1px solid #2d3748; background-color: #2d3748; color: #fff; font-size: 1rem; outline: none; font-family: inherit;">
                        <option value="" disabled selected>Escolha uma categoria...</option>
                        <option value="padrao">Geral (Sem variações específicas)</option>
                        <option value="roupas">Roupas e Vestuário</option>
                        <option value="calcados">Calçados</option>
                        <option value="eletronicos">Eletrônicos e Tecnologia</option>
                        <option value="suplementos">Alimentação e Suplementos</option>
                        <option value="acessorios">Acessórios (Relógios, Óculos, etc)</option>
                    </select>
                </div>

                <!-- Onde os filtros (tamanhos/voltagem) vão aparecer dinamicamente -->
                <div id="dynamic-attributes-container" style="margin-top: 0.5rem; padding: 1rem; background-color: rgba(255,255,255,0.02); border: 1px dashed #4a5568; border-radius: 8px; display: none;">
                    <!-- Injetado via JS -->
                </div>

                <div class="input-row" style="margin-top: 0.5rem;">
                    <div class="input-group">
                        <label for="prod-price">Preço (R$)</label>
                        <input type="number" step="0.01" id="prod-price" placeholder="0.00" required>
                    </div>
                    <div class="input-group">
                        <label for="prod-stock">Quantidade em Estoque</label>
                        <input type="number" id="prod-stock" placeholder="10" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="prod-desc">Descrição</label>
                    <textarea id="prod-desc" rows="3" placeholder="Detalhes do material, tamanho, etc..." required></textarea>
                </div>

                <div class="input-group" style="margin-top: 1rem;">
                    <label for="prod-image">Fotografia do Produto</label>
                    <input type="file" id="prod-image" accept="image/png, image/jpeg, image/webp" style="padding: 0.5rem;">
                </div>

                <h3 style="color: #a0aec0; font-size: 0.9rem; margin-top: 0.5rem;">Dados Logísticos (Ocultos do Cliente)</h3>
                <div class="input-row">
                    <div class="input-group">
                        <label for="prod-weight">Peso (kg)</label>
                        <input type="number" step="0.001" id="prod-weight" placeholder="Ex: 0.300" required>
                    </div>
                    <div class="input-group">
                        <label for="prod-length">Comp. (cm)</label>
                        <input type="number" id="prod-length" placeholder="Ex: 20" required>
                    </div>
                    <div class="input-group">
                        <label for="prod-width">Largura (cm)</label>
                        <input type="number" id="prod-width" placeholder="Ex: 15" required>
                    </div>
                    <div class="input-group">
                        <label for="prod-height">Altura (cm)</label>
                        <input type="number" id="prod-height" placeholder="Ex: 5" required>
                    </div>
                </div>

                <button type="submit" id="btn-save-product">Salvar Produto</button>
            </form>
        </div>
    </div>

    <script type="module" src="public/js/firebase-config.js"></script>
    <script type="module" src="public/js/produtos.js"></script>
</body>
</html>
