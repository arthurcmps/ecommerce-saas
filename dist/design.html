<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizar Design - Lojista</title>
  <script type="module" crossorigin src="/assets/design-BPkelWGf.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/aws-config-E_cuEw3K.js">
  <link rel="modulepreload" crossorigin href="/assets/firebase-config-B42Cxf1x.js">
  <link rel="modulepreload" crossorigin href="/assets/sidebar-2qXlHoxD.js">
  <link rel="stylesheet" crossorigin href="/assets/sidebar-BKByVxPa.css">
  <link rel="stylesheet" crossorigin href="/assets/design-CNGgshAg.css">
  <link rel="stylesheet" crossorigin href="/assets/style-BtaBsTWo.css">
</head>
<body>
    <div id="dashboard-content" class="dashboard-container" style="display: none;">
        
        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="top-header">
                <h1>Identidade Visual</h1>
                <p style="color: #a0aec0;">Configure as cores e o layout da sua vitrine pública.</p>
            </header>

            <section class="design-container">
                <div class="design-card">
                    <form id="design-form">
                        <h3>Cores da Marca</h3>
                        <p class="section-desc">Estas cores serão aplicadas nos botões, cabeçalhos e destaques da sua loja.</p>
                        
                        <div class="color-pickers-row">
                            <div class="input-group color-group">
                                <label for="primary-color">Cor Principal</label>
                                <div class="color-input-wrapper">
                                    <input type="color" id="primary-color" required>
                                    <span id="primary-hex" class="hex-display">#000000</span>
                                </div>
                            </div>

                            <div class="input-group color-group">
                                <label for="secondary-color">Cor Secundária</label>
                                <div class="color-input-wrapper">
                                    <input type="color" id="secondary-color" required>
                                    <span id="secondary-hex" class="hex-display">#000000</span>
                                </div>
                            </div>
                        </div>

                        <h3 style="margin-top: 2rem;">Estrutura da Loja</h3>
                        <p class="section-desc">Como prefere que os seus produtos sejam exibidos?</p>
                        
                        <div class="input-group">
                            <label for="vitrine-style">Estilo da Vitrine</label>
                            <select id="vitrine-style" required>
                                <option value="grid">Grelha Clássica (Lado a lado)</option>
                                <option value="carousel">Carrossel (Deslizante)</option>
                            </select>
                        </div>

                        <button type="submit" id="btn-save-design" class="primary-btn" style="margin-top: 2rem;">Guardar Alterações</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
