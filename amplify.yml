version: 1
backend:
  phases:
    build:
      commands:
        - echo "Instalando dependências..."
        - npm install --legacy-peer-deps
        - echo "Verificando estrutura..."
        - ls -la amplify/
        - echo "Executando deploy do backend..."
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*