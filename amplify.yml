version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Adicionamos a flag aqui para ignorar conflitos de bibliotecas internas
        - npm install --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*